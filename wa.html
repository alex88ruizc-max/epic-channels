<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Abrir WhatsApp</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #0b0f17; color: #e5e7eb; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .caja { max-width: 420px; margin: 0 auto; padding: calc(36px + env(safe-area-inset-top, 0px)) 18px 30px; text-align: center; }
  h1 { font-size: 18px; margin: 10px 0 4px; }
  p { color: #9ca3af; font-size: 13px; margin: 0 0 18px; }
  a.b { display: block; padding: 14px; border-radius: 14px; font-weight: 800; font-size: 15px; text-decoration: none; margin-top: 10px; }
  .n { background: #22c55e; color: #04120c; }
  .w { background: #128c7e; color: #fff; }
  .x { background: #1f2937; color: #e5e7eb; border: 1px solid #374151; font-size: 13px !important; }
</style>
</head>
<body>
<div class="caja">
  <div style="font-size:40px">💬</div>
  <h1 id="tit">Abriendo WhatsApp…</h1>
  <p id="sub">Si no se abre solo, toca el botón.</p>
  <a class="b n" id="bN" href="#">💬 Abrir en WhatsApp</a>
  <a class="b w" id="bB" href="#">💼 Abrir en WhatsApp Business</a>
  <a class="b x" id="bW" href="#">Abrir con wa.me</a>
</div>
<script>
  (function () {
    var q = new URLSearchParams(location.search), n = String(q.get('n') || '').replace(/\D/g, ''), t = String(q.get('t') || ''), a = q.get('a') === 'b' ? 'b' : 'n';
    if (n.length === 10) n = '57' + n;
    var android = /android/i.test(navigator.userAgent), web = 'https://wa.me/' + n + (t ? '?text=' + encodeURIComponent(t) : '');
    function intento(pkg) { return 'intent://send/?phone=' + n + (t ? '&text=' + encodeURIComponent(t) : '') + '#Intent;scheme=whatsapp;package=' + pkg + ';S.browser_fallback_url=' + encodeURIComponent(web) + ';end'; }
    var urlN = android ? intento('com.whatsapp') : web, urlB = android ? intento('com.whatsapp.w4b') : web;
    document.getElementById('bN').href = urlN; document.getElementById('bB').href = urlB; document.getElementById('bW').href = web;
    if (!/^\d{11,13}$/.test(n)) { document.getElementById('tit').textContent = 'Número no válido'; document.getElementById('sub').textContent = 'Revisa el enlace.'; return; }
    document.getElementById('tit').textContent = 'Abriendo ' + (a === 'b' ? 'WhatsApp Business' : 'WhatsApp') + '…';
    setTimeout(function () { location.href = a === 'b' ? urlB : urlN; }, 150);
  })();
</script>
</body>
</html>
