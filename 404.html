<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPIC STREAMING</title>
<meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f19;color:#9ca3af;font:14px system-ui,sans-serif}</style>
<script>
// Enlaces cortos de EPIC: epicchannels.quest/recargar → /#recargar, /p/<producto> → /#p/<producto>, etc.
(function () {
  var r = location.pathname.replace(/^\/+|\/+$/g, ''), q = location.search || '', destino = '';
  var mapa = { recargar: 'recargar', recarga: 'recargar', registro: 'registro', registrarme: 'registro', 'crear-cuenta': 'registro', tienda: 'tienda',
    cuentas: 'mis-cuentas/cuentas', 'mis-cuentas': 'mis-cuentas/cuentas', cuenta: 'mis-cuentas/cuentas', datos: 'mis-cuentas/datos',
    credito: 'mis-cuentas/credito', 'crédito': 'mis-cuentas/credito', recargas: 'mis-cuentas/recargas', netflix: 'netflix', entrar: 'tienda' };
  var low = decodeURIComponent(r).toLowerCase();
  if (mapa[low]) destino = mapa[low];
  else if (/^p\/[A-Za-z0-9_-]{2,60}$/.test(r)) destino = 'p/' + r.slice(2);            // conserva mayúsculas del producto
  else if (/^v\/[A-Za-z0-9]{16,40}$/.test(r)) destino = 'vincular/' + r.slice(2);     // enlace mágico de WhatsApp
  location.replace('/' + q + (destino ? '#' + destino : ''));
})();
</script>
</head>
<body>Abriendo EPIC STREAMING…</body>
</html>
